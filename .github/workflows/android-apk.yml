name: Android APK

# Builds an installable, signed APK on every push to master and on demand from the
# Actions tab. The upstream project's release pipeline only runs on version tags and
# wants the maintainer's signing setup; this one is the everyday "give me an APK"
# job. It uses the same two secrets as the release job (SIGNING_KEYSTORE_BASE64 and
# SIGNING_STORE_PASSWORD); without them it falls back to a throwaway keystore, which
# works but makes Android refuse to install the next build over this one.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # android-actions/setup-android is broken (tries to install the long-gone
      # "tools" package), so install cmdline-tools directly.
      - name: Setup Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm cmdtools.zip
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"

      - name: Add Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android

      - name: Install cargo-apk
        run: cargo install cargo-apk --version 0.10.0 --locked

      - name: Restore signing key
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "password=${{ secrets.SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Signing with the repository key."
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set: signing with a throwaway key, so the next build will not install over this one."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype pkcs12 \
              -alias flipflop -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass flipflop -keypass flipflop -dname "CN=flipflop"
            echo "password=flipflop" >> "$GITHUB_ENV"
          fi

      # cargo-apk signs the release APK itself during the build; the keystore comes
      # from the environment (no manifest changes needed).
      - name: Build signed release APK
        env:
          ANDROID_PLATFORM: android-35
          ANDROID_BUILD_TOOLS_VERSION: 35.0.0
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
        run: |
          export CARGO_APK_RELEASE_KEYSTORE_PASSWORD="$password"
          cargo apk build --release --lib -p flipflop

      - name: Verify APK signature
        run: |
          # NOTE: target/release/apk also holds an unsigned *-unaligned.apk
          # intermediate (plus .idsig sidecar), verify the exact signed APK.
          apk=target/release/apk/flipflop.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          mkdir dist
          cp "$apk" dist/flipflop.apk
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flipflop-apk-${{ github.sha }}
          path: dist/flipflop.apk

      # A rolling pre-release keeps a permanent download URL, so the phone can just
      # open one link instead of digging through artifact downloads.
      - name: Publish to the android-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "Built from commit \`${SHA:0:7}\`."
            echo
            echo "### Install"
            echo "Android 8.0+ (minSdk 26). If Android refuses the update with"
            echo "\"app not installed\" / \`INSTALL_FAILED_UPDATE_INCOMPATIBLE\`,"
            echo "uninstall the previous build first: an APK signed with a different"
            echo "key cannot replace it."
            echo
            echo "### 安装"
            echo "支持 Android 8.0 及以上。如果提示「无法安装 / 应用未安装」，"
            echo "请先卸载旧版本再安装：签名不同的 APK 无法覆盖安装。"
          } > "$RUNNER_TEMP/notes.md"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create android-latest --prerelease --target "$SHA" \
              --title "Android APK (rolling)" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload android-latest dist/flipflop.apk --clobber
          {
            echo "### APK"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/android-latest/flipflop.apk"
          } >> "$GITHUB_STEP_SUMMARY"
