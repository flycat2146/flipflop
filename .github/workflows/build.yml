name: Build

# Rolling build: a signed Android APK and the desktop binaries for every push to
# master (this repository is a fork whose upstream release pipeline only runs on
# version tags), plus on demand from the Actions tab. Everything lands in the
# `rolling-latest` pre-release, so the download URLs never change.
#
# The Android job uses the same two secrets as the upstream release job
# (SIGNING_KEYSTORE_BASE64 and SIGNING_STORE_PASSWORD); without them it falls back
# to a throwaway keystore, which works but makes Android refuse to install the next
# build over this one.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # android-actions/setup-android is broken (tries to install the long-gone
      # "tools" package), so install cmdline-tools directly.
      - name: Setup Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm cmdtools.zip
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"

      - name: Add Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android

      - name: Install cargo-apk
        run: cargo install cargo-apk --version 0.10.0 --locked

      - name: Restore signing key
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "password=${{ secrets.SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Signing with the repository key."
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set: signing with a throwaway key, so the next build will not install over this one."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype pkcs12 \
              -alias flipflop -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass flipflop -keypass flipflop -dname "CN=flipflop"
            echo "password=flipflop" >> "$GITHUB_ENV"
          fi

      # cargo-apk signs the release APK itself during the build; the keystore comes
      # from the environment (no manifest changes needed).
      - name: Build signed release APK
        env:
          ANDROID_PLATFORM: android-35
          ANDROID_BUILD_TOOLS_VERSION: 35.0.0
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
        run: |
          export CARGO_APK_RELEASE_KEYSTORE_PASSWORD="$password"
          cargo apk build --release --lib -p flipflop

      - name: Verify APK signature
        run: |
          # NOTE: target/release/apk also holds an unsigned *-unaligned.apk
          # intermediate (plus .idsig sidecar), verify the exact signed APK.
          apk=target/release/apk/flipflop.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          mkdir dist
          cp "$apk" dist/flipflop.apk
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/flipflop.apk

  desktop:
    name: desktop (${{ matrix.slug }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            slug: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            slug: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            slug: macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            slug: macos-x86_64
    steps:
      - uses: actions/checkout@v4

      # The version baked into the desktop builds is the one in Cargo.toml
      # (rolling builds are not stamped from a tag, unlike the release workflow).
      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "::error::could not read the version from Cargo.toml"
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "building flipflop $version"

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig-dev libssl-dev clang ninja-build

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir dist
          tar -czf "dist/flipflop-${{ steps.version.outputs.name }}-${{ matrix.slug }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" flipflop

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          mkdir dist
          Compress-Archive -Path "target/${{ matrix.target }}/release/flipflop.exe" `
            -DestinationPath "dist/flipflop-${{ steps.version.outputs.name }}-${{ matrix.slug }}.zip"

      # TODO(signing): unsigned builds trigger SmartScreen. Sign
      # target/<target>/release/flipflop.exe in a step before "Package
      # (windows)", and the setup .exe after this one (SignPath, Azure
      # Trusted Signing or signtool with a certificate).
      - name: Build installer (windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.name }}" `
            "/DSourceExe=$PWD\target\${{ matrix.target }}\release\flipflop.exe" `
            "/DOutputDir=$PWD\dist" `
            windows\flipflop.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The script already names it flipflop-<version>-windows-x86_64-setup.exe.

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.slug }}
          path: dist/*

  publish:
    name: publish
    needs: [apk, desktop]
    runs-on: ubuntu-latest
    steps:
      # `gh release create --target` resolves the tag itself, which needs a
      # checkout (and the push below has nothing else to work with).
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: dist

      # A rolling pre-release keeps permanent download URLs, so a phone or a
      # desktop just follows one link instead of digging through artifact downloads.
      - name: Publish the rolling-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          ls -l dist
          {
            echo "Rolling build from commit \`${SHA:0:7}\` — fixes Chinese rendering on Android"
            echo "(the system CJK fonts were never wired up as fallbacks, so every character"
            echo "came out as a box) and adds a translatable interface, Chinese included."
            echo
            echo "| file | platform |"
            echo "| --- | --- |"
            echo "| \`flipflop.apk\` | Android 8.0+ (minSdk 26) |"
            echo "| \`flipflop-*-windows-x86_64-setup.exe\` | Windows 10/11 installer |"
            echo "| \`flipflop-*-windows-x86_64.zip\` | Windows 10/11 portable .exe (no install) |"
            echo "| \`flipflop-*-linux-x86_64.tar.gz\` | Linux x86_64 |"
            echo "| \`flipflop-*-macos-aarch64.tar.gz\` | macOS (Apple silicon) |"
            echo "| \`flipflop-*-macos-x86_64.tar.gz\` | macOS (Intel) |"
            echo
            echo "### 安装 / Install"
            echo "- **Android**: if Android refuses the update with \"app not installed\""
            echo "  (\`INSTALL_FAILED_UPDATE_INCOMPATIBLE\`), uninstall the previous build"
            echo "  first: an APK signed with a different key cannot replace it."
            echo "  （如果提示「无法安装」，先卸载旧版本；签名不同无法覆盖安装。之后升级可直接覆盖。）"
            echo "- **Windows**: SmartScreen will warn about the unsigned .exe — \"More info\" →"
            echo "  \"Run anyway\"."
            echo "- The interface follows the system language; pick another one in"
            echo "  Settings → Language（设置 → 语言）."
          } > "$RUNNER_TEMP/notes.md"

          if gh release view rolling-latest >/dev/null 2>&1; then
            gh release edit rolling-latest --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create rolling-latest --prerelease --target "$SHA" \
              --title "Rolling build (latest master)" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload rolling-latest dist/* --clobber

          {
            echo "### Downloads"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/rolling-latest"
          } >> "$GITHUB_STEP_SUMMARY"
